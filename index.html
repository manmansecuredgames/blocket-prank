<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #16bdc9;
    }
    .topbar {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #9843aa;
      border-bottom: 6px solid #7e3a92;
      position: relative;
      z-index: 2;
    }
    .brand, .login { font-weight: 800; font-size: 30px; }
    .brand { letter-spacing: -1px; }
    .join { font-size: 29px; font-weight: 700; }
    .login { text-decoration: underline; font-size: 25px; }
    .background {
      position: absolute; inset: 55px 0 0;
      opacity: .42;
      background-image:
        linear-gradient(25deg, transparent 0 46%, rgba(255,255,255,.18) 47% 54%, transparent 55%),
        linear-gradient(115deg, transparent 0 43%, rgba(255,255,255,.16) 44% 57%, transparent 58%);
      background-size: 215px 190px, 280px 250px;
      transform: rotate(-2deg) scale(1.2);
    }
    .background::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(255,255,255,.28), transparent 14%),
                  radial-gradient(ellipse at 82% 16%, rgba(255,255,255,.3), transparent 13%),
                  radial-gradient(ellipse at 58% 70%, rgba(255,255,255,.24), transparent 16%);
    }
    main { position: relative; height: calc(100% - 55px); display: grid; place-items: center; }
    .card { margin-top: -35px; text-align: center; }
    h1 {
      margin: 0 0 30px;
      font-size: 78px;
      line-height: .9;
      letter-spacing: -3px;
      text-shadow: 0 7px 0 #078e9b;
    }
    .form { display: flex; gap: 9px; justify-content: center; }
    input, button {
      height: 60px; border: 0; border-radius: 6px; background: #fff;
      box-shadow: 0 6px 0 rgba(0,0,0,.18); font: 700 34px Arial; color: #666;
    }
    input { width: 200px; text-align: center; outline: none; }
    input::placeholder { color: #777; opacity: 1; }
    button { width: 61px; cursor: pointer; font-size: 42px; line-height: 1; }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
    @media (max-width: 600px) {
      .join { font-size: 20px; } .brand { font-size: 25px; } .login { font-size: 20px; }
      h1 { font-size: 60px; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">Blooket</div><div class="join">Join a Game</div><div class="login">Log In</div></header>
  <div class="background" aria-hidden="true"></div>
  <main>
    <section class="card">
      <h1>Blooket</h1>
      <div class="form">
        <input id="code" inputmode="numeric" autocomplete="off" placeholder="Game ID" aria-label="Game ID">
        <button id="go" aria-label="Join">→</button>
      </div>
    </section>
  </main>
  <script>
    const destinations = {
      '1': 'https://yoowsp.vercel.app/',
      '2': 'https://manmansecuredgames.github.io/single-page-web-app/'
    };
    function launch() {
      const destination = destinations[document.getElementById('code').value.trim()];
      if (!destination) return;
      // Open the destination in a blank, unbranded tab.
      const blank = window.open('about:blank', '_blank');
      if (blank) {
        blank.document.title = '';
        blank.document.head.innerHTML = '<meta charset="utf-8"><title></title>';
        blank.location.replace(destination);
      } else {
        window.location.href = destination;
      }
    }
    document.getElementById('go').addEventListener('click', launch);
    document.getElementById('code').addEventListener('keydown', event => {
      if (event.key === 'Enter') launch();
    });
  </script>
</body>
</html>
